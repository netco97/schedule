<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ホーム | 勤怠管理システム</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<header class="home-header">
    <div class="home-header-right">
        <span>こんにちは <strong th:text="${username}">ユーザー</strong> さん</span>
        <a th:href="@{/logout}" class="logout-btn">ログアウト</a>
    </div>
</header>

<main class="home-main">
    <h1>勤怠管理システムへようこそ！</h1>

    <!-- 근무표 등록 버튼 -->
    <div class="home-buttons">
        <a th:href="@{/schedule/list}">
            <button class="primary-btn">勤務表登録へ</button>
        </a>
    </div>

    <!-- 최근 등록된 근무표 요약 -->
    <section class="recent-schedules">
        <h2>最近の勤務表</h2>
        <div th:each="s : ${recentSchedules}" class="schedule-card">
            <p th:text="${s.workDate} + '：' + ${s.startTime} + '〜' + ${s.endTime}">2025-11-09：08:00〜17:00</p>
        </div>
        <div th:if="${#lists.isEmpty(recentSchedules)}" class="no-schedule">
            登録された勤務表はありません。
        </div>
    </section>
</main>
</body>
</html>
