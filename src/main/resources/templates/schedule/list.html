<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務表管理 | 勤怠管理システム</title>

    <!-- 外部CSS -->
    <link rel="stylesheet" th:href="@{/css/list.css}" />
</head>
<body>
<header class="header">
    <div class="header-right">
        <span>こんにちは <strong th:text="${username}">ユーザー</strong> さん</span>
        <a th:href="@{/logout}" class="logout-btn">ログアウト</a>
    </div>
</header>

<main class="main-content">
    <!-- 新規勤務追加フォーム -->
    <section class="form-section">
        <h2>新規勤務追加</h2>
        <form th:action="@{/schedule/add}" method="post">
            <input type="date" name="workDate" required>
            <input type="time" name="startTime" required>
            <input type="time" name="endTime" required>
            <button type="submit" class="primary-btn">追加</button>
        </form>
    </section>

    <!-- カレンダー表示 -->
    <section class="calendar-section">
        <h2>勤務表カレンダー</h2>
        <div class="calendar-header">
            <div>日</div><div>月</div><div>火</div><div>水</div>
            <div>木</div><div>金</div><div>土</div>
        </div>

        <div class="calendar-body">
            <div th:each="day : ${days}" class="calendar-day">
                <span class="date-number" th:text="${day}">1</span>
                <div th:each="s : ${schedules}" 
                     th:if="${s.workDate != null and s.workDate.dayOfMonth == day}"
                     class="schedule-item">
                    <span th:text="${s.startTime} + '〜' + ${s.endTime}">08:00〜17:00</span>
                </div>
            </div>
        </div>
    </section>
</main>

</body>
</html>
