<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン | 勤務表アプリ</title>

    <!-- フォントの読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&family=Pretendard:wght@500&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Pretendard', 'Noto Sans JP', sans-serif;
            background: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 360px;
            text-align: center;
        }
        h2 {
            margin-bottom: 25px;
            color: #333;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover {
            background: #45a049;
        }
        .link {
            margin-top: 15px;
            font-size: 14px;
        }
        .link a {
            color: #007bff;
            text-decoration: none;
        }
        .link a:hover {
            text-decoration: underline;
        }

        /* エラーメッセージのスタイル */
        .error-message {
            color: red;
            font-size: 13px;
            animation: fadeOut 2s forwards;
        }

        /* 2秒間でフェードアウト */
        @keyframes fadeOut {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; display: none; }
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>ログイン</h2>

    <!-- エラーメッセージ表示 -->
    <div th:if="${param.error}">
        <p th:if="${param.error[0] eq 'bad_password'}" class="error-message">パスワードが間違っています。</p>
        <p th:if="${param.error[0] eq 'no_user'}" class="error-message">存在しないユーザーです。会員登録してください。</p>
        <p th:if="${param.error[0] eq 'unknown'}" class="error-message">ログインエラーが発生しました。</p>
    </div>

    <!-- ログインフォーム -->
    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="ユーザー名" required>
        <input type="password" name="password" placeholder="パスワード" required>
        <button type="submit">ログイン</button>
    </form>

    <!-- 会員登録リンク -->
    <div class="link">
        <p>アカウントをお持ちでないですか？ <a th:href="@{/join}">新規登録</a></p>
    </div>
</div>

</body>
</html>
